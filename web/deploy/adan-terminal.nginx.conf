# ADAN0 Terminal — nginx vhost (sous-domaine dédié).
# Active avec: sudo bash web/deploy/install_nginx.sh
# Prérequis DNS: faire pointer adan.novahosting.site -> 13.140.151.85 (A record).

server {
    server_name adan.novahosting.site;

    # Backend FastAPI (sert aussi le frontend buildé sur la même origine)
    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket télémétrie temps réel
    location /ws/ {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    listen 80;
    listen [::]:80;
}
